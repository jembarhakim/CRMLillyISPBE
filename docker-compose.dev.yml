version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: skripsi_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: skripsi_db
      MYSQL_USER: skripsi_user
      MYSQL_PASSWORD: skripsi_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
